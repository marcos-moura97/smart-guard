name: Build
#on:
#  schedule:
#    - cron: '29 15 * * *'
#  push:
#    branches: [ "master" ]
#  pull_request:
#    branches: [ "master" ]
env:
  #RUST_BACKTRACE: 1
  #RUST_LOG: "cargo_tarpaulin=trace,llvm_profparser=trace"
jobs:
  check:
    name: "Check"
    runs-on: "ubuntu-latest"
    strategy:
      fail-fast: false
    steps:
    - uses: "actions/checkout@v3"
      name: "Checkout"
    - name: Clone RISCV toolchain
      run: git clone https://github.com/riscv/riscv-gnu-toolchain
    - name: Install packages
      run: sudo apt-get update && sudo apt -y install autoconf automake autotools-dev curl python3 libmpc-dev libmpfr-dev libgmp-dev gawk build-essential bison flex texinfo gperf libtool patchutils bc zlib1g-dev libexpat-dev ninja-build
    - name: Configure toolchain
      run: cd riscv-gnu-toolchain && ./configure --prefix=/opt/riscv --with-arch=rv32gc --with-abi=ilp32d
    - name: Install toolchain
      run: make linux && cd ..
    - name: Build project
      uses: cmake --build ./build --config Debug --target all --