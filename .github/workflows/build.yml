# not sure if this will work, so we're not enabling automated runs yet
name: Build
on:
  schedule:
    - cron: '29 15 * * *'
  push:
    branches: [ "dev-refactor" ]
  pull_request:
    branches: [ "dev-refactor" ]
#env:
  #RUST_BACKTRACE: 1
  #RUST_LOG: "cargo_tarpaulin=trace,llvm_profparser=trace"
jobs:
  check:
    name: "Check"
    runs-on: "ubuntu-latest"
    strategy:
      fail-fast: false
    steps:
    - uses: "actions/checkout@v3"
      name: "Checkout"
    - name: Install packages
      run: sudo apt-get update && sudo apt -y install autoconf automake autotools-dev curl python3 libmpc-dev libmpfr-dev libgmp-dev gawk build-essential bison flex texinfo gperf libtool patchutils bc zlib1g-dev libexpat-dev ninja-build
    - name: Clone RISCV toolchain
      run: cd /home/runner/work && git clone https://github.com/riscv/riscv-gnu-toolchain
    - name: Configure toolchain
      run: cd /home/runner/work/riscv-gnu-toolchain && ./configure --prefix=/opt/riscv --with-arch=rv32gc --with-abi=ilp32d
    - name: Install toolchain
      run: cd /home/runner/work/riscv-gnu-toolchain && make linux
    - name: Build project
      run: cd /home/runner/work/smart-guard && cmake --build ./build --config Debug --target all --